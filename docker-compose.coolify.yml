services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      APP_ENV: ${APP_ENV:?production}
      SECRET_KEY: ${SECRET_KEY:?}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?}
      CORS_ORIGINS: ${CORS_ORIGINS:?}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      MANAGER_PHONE: ${MANAGER_PHONE:-}
      CRM_REMINDERS_ENABLED: ${CRM_REMINDERS_ENABLED:-true}
      CRM_REMINDER_SYNC_INTERVAL_SECONDS: ${CRM_REMINDER_SYNC_INTERVAL_SECONDS:-300}
      CRM_SMTP_REQUIRED: ${CRM_SMTP_REQUIRED:-true}
      LABEL_OUTPUT_DIR: ${LABEL_OUTPUT_DIR:-/data/output/labels}
      WATCH_DIR: ${WATCH_DIR:-/data/exports_proges_valides}
      OUTPUT_QR_DIR: ${OUTPUT_QR_DIR:-/data/output/qr}
      API_URL: ${API_URL:-http://backend:7000}
      PRINTER_NAME: ${PRINTER_NAME:-}
      SMTP_SERVER: ${SMTP_SERVER:-localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      PURCHASES_CC_EMAIL: ${PURCHASES_CC_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - mmg_uploads:/app/uploads
    ports:
      - "7000"
    # L'entrypoint du Dockerfile applique déjà `alembic upgrade head` avant
    # d'exécuter cette commande ; on ne garde ici que le bootstrap admin
    # (idempotent) puis le démarrage uvicorn.
    command: >
      sh -c "python init_db.py
      && python -m uvicorn backend.main:app --host 0.0.0.0 --port 7000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7000/health/ready', timeout=5).read()"]
      interval: 10s
      timeout: 10s
      retries: 30
      # start_period tolère le temps d'exécution des migrations Alembic au
      # premier déploiement (base vide) comme lors des mises à jour.
      start_period: 120s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend_v2
      args:
        VITE_API_URL: ${VITE_API_URL:?}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  mmg_uploads:
